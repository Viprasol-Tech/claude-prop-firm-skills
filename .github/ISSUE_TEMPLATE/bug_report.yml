name: Bug or wrong fact
description: A skill gave wrong code, a wrong fact, or a script failed
labels: [bug]
body:
  - type: dropdown
    id: skill
    attributes:
      label: Skill
      options: [prop-rules-engine, challenge-planner, mt5-ea-guard, futures-bot-guard, restricted-practices, prop-journal, other]
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you asked, what you got, and what was wrong. Paste error messages exactly; remove any secrets.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What is correct
      description: Link to the official documentation if it is a platform fact.
  - type: input
    id: version
    attributes:
      label: Plugin version and Claude Code version
      placeholder: "prop-firm-guard 1.0.0, Claude Code 2.x"
